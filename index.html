   <div class="box merke"><div class="boxtitle">Merke</div>Das Magnetfeld B in einer Spule ist <b>proportional</b> zur Stromstärke I: &nbsp;<b>B ~ I</b>.<br>Je größer die Stromstärke, desto größer das Magnetfeld.</div>`},
 {t:'num', id:'s1-a1', q:'Lies im Diagramm ab: Wie groß ist B bei I = 2 A?', a:4.7, unit:'mT', show:'4,7', tol:0.03, explain:'Bei I = 2 A liegt der Messpunkt bei B = 4,7 mT.'},
 {t:'num', id:'s1-a2', q:'B ist proportional zu I. Wie groß ist B (ungefähr) bei I = 4 A? Benutze den Wert aus der letzten Aufgabe.', a:9.4, unit:'mT', show:'9,4', tol:0.03, hint:'4 A ist doppelt so viel wie 2 A.', explain:'Doppelte Stromstärke → doppeltes Feld: 2 · 4,7 mT = 9,4 mT.'},
 {t:'cloze', id:'s1-a3', q:'Ergänze den „Je …, desto …“-Satz von Gruppe A.', lines:['Je {*größer|kleiner} die Stromstärke I ist, desto {*größer|kleiner} ist das Magnetfeld B.','Wenn man die Stromstärke halbiert, dann wird B {doppelt so groß|*halb so groß|gleich groß}.'], explain:'B ~ I: mehr Strom → mehr Feld, halber Strom → halbes Feld.'},
 {t:'mc', id:'s1-a4', q:'Gruppe A polt den Strom um (+ und – tauschen). Bei I = 2 A zeigt das Teslameter vorher +4,7 mT. Was zeigt es nachher?', opts:['−4,7 mT','+4,7 mT','0 mT','+9,4 mT'], a:0,
   explain:'Beim Umpolen dreht sich die Richtung des Magnetfeldes um. Der Betrag bleibt gleich, das Vorzeichen wechselt: −4,7 mT.'},
 {t:'mc', id:'s1-a5', q:'Welcher Satz beschreibt „B ist proportional zu I“ richtig?', opts:['Der Graph von B gegen I ist eine Gerade durch den Ursprung.','Der Graph von B gegen I ist eine waagerechte Linie.','Wenn I größer wird, wird B kleiner.','B ist immer gleich groß wie I.'], a:0,
   explain:'Proportional bedeutet: Gerade durch den Ursprung. Der Quotient B : I ist immer gleich.'},

 {t:'h3', text:'Gruppe B: Wie ändert sich B entlang der Achse?'},
 {t:'html', html:`<div class="card">
   ${graph({x:[-15,15,5], y:[0,6,1], xl:'z in cm', yl:'B in mT', w:460, h:260, fn:null, series:[{fn:z=>bAxis(z/100), color:'#0b7bc1'}], bands:[[-7.5,7.5,'#fdeedd','Spule']], caption:'z = 0 ist die Mitte der Spule. Die Spule geht von −7,5 cm bis +7,5 cm (I bleibt gleich).'})}
   <ul><li>In der Spule ist B <b>fast konstant</b> (ein „Plateau“). In der Mitte ist B am größten.</li>
   <li>Am <b>Ende der Spule</b> ist B nur noch etwa <b>halb so groß</b> wie in der Mitte.</li>
   <li>Außerhalb der Spule wird B schnell kleiner.</li>
   <li>Der Graph ist <b>symmetrisch</b> zur Mitte.</li>
   <li>An den Enden ändert sich B schnell. Dort braucht man kleine Schritte (mm-Schritte).</li></ul></div>`},
 {t:'mc', id:'s1-b1', q:'Wo ist B entlang der Achse am größten?', opts:['In der Mitte der Spule.','Am Ende der Spule.','Weit außerhalb der Spule.','Überall gleich, auch außerhalb.'], a:0, explain:'In der Mitte ist das Feld am stärksten. Innen ist es fast konstant.'},
 {t:'num', id:'s1-b2', q:'In der Mitte der Spule misst Gruppe B 4,8 mT. Etwa wie groß ist B am Ende der Spule?', a:2.4, unit:'mT', show:'2,4', tol:0.1, hint:'Am Ende ist das Feld etwa halb so groß.', explain:'Am Spulenende ist B etwa die Hälfte: 4,8 mT : 2 = 2,4 mT.'},
 {t:'mc', id:'s1-b3', q:'Wo lohnen sich Millimeter-Schritte am meisten?', opts:['An den Enden der Spule – dort ändert sich B schnell.','In der Mitte – dort ist B am größten.','Weit weg von der Spule.'], a:0, explain:'Wo sich B schnell ändert (an den Enden), braucht man kleine Schritte. In der Mitte reichen große Schritte, weil B fast konstant ist.'},

 {t:'h3', text:'Gruppe C: Wie ändert sich B senkrecht zur Achse?'},
 {t:'html', html:`<div class="card">
   ${graph({x:[0,6,1], y:[-1,5,1], xl:'x in cm', yl:'B in mT', w:460, h:260, series:[{pts:[[0,4.65],[1,4.66],[2,4.68],[2.8,4.7],[3.0,2.2],[3.2,-0.35],[4,-0.26],[5,-0.22],[6,-0.19]], color:'#0b7bc1'}], bands:[[2.9,3.1,'#e8b98f','Draht']], caption:'Messlinie in der Mitte der Spule. x = 0 ist auf der Achse. Bei x = 3 cm ist die Wicklung.'})}
   <ul><li>In der Spule ist B <b>überall fast gleich groß</b>. Man sagt: Das Feld ist <b>homogen</b> (homogeneous).</li>
   <li>An der Wicklung wechselt das <b>Vorzeichen</b>.</li>
   <li>Außerhalb ist B <b>klein</b> und zeigt in die <b>andere Richtung</b> (negativ). Die Feldlinien schließen sich außen.</li></ul></div>`},
 {t:'cloze', id:'s1-c1', q:'Ergänze die Sätze zu Gruppe C.', lines:['In der Spule ist das Magnetfeld überall {*fast gleich groß|an der Achse null|an der Wicklung doppelt so groß}.','Außerhalb der Spule ist das Magnetfeld {*klein und negativ|groß und positiv|genau null}.','Ein Feld, das überall gleich ist, heißt {*homogen|proportional|senkrecht}.'], explain:'Innen: homogen. Außen: klein und mit anderem Vorzeichen.'},
 {t:'mc', id:'s1-c2', q:'Anwendung: Im Krankenhaus gibt es den MRT (magnetic resonance imaging). Der Patient liegt <b>in</b> einer großen Spule. Warum ist das gut?', opts:['In der Spule ist das Feld stark und homogen (überall gleich).','Außerhalb der Spule ist das Feld am stärksten.','In der Spule gibt es kein Magnetfeld.'], a:0,

 {t:'h2', text:'1.5 Die Formel für eine lange Spule', id:'s1-f'},
 {t:'html', html:`<div class="card center">${FORMULA}</div>
  <div class="card"><table class="vocab"><thead><tr><th>Zeichen</th><th>Bedeutung</th><th>Einheit</th></tr></thead><tbody>
   <tr><td class="de">B</td><td>Magnetfeld (Flussdichte) in der Spule <span class="en">magnetic flux density</span></td><td>T (Tesla)</td></tr>
   <tr><td class="de">μ₀</td><td>magnetische Feldkonstante: μ₀ = 1,26 · 10⁻⁶ T·m/A <span class="en">magnetic constant</span></td><td>T·m/A</td></tr>
   <tr><td class="de">N</td><td>Windungszahl (Anzahl der Windungen) <span class="en">number of turns</span></td><td>–</td></tr>
   <tr><td class="de">I</td><td>Stromstärke <span class="en">current</span></td><td>A (Ampere)</td></tr>
   <tr><td class="de">L</td><td>Länge der Spule <span class="en">length of the coil</span></td><td>m (Meter!)</td></tr></tbody></table>
   <p><b>Wichtig:</b> Die Länge L immer in <b>Meter</b> einsetzen. Dann bekommst du B in <b>Tesla</b>. Für mT: mal 1000.</p>
   <p>In der Formel siehst du: <b>I steht im Zähler</b> (oben). Darum gilt B ~ I – genau wie bei Gruppe A!</p></div>
   <div class="box info"><div class="boxtitle">Beispiel</div>N = 300, L = 15 cm = 0,15 m, I = 2 A<br>
   B = 1,26·10⁻⁶ T·m/A · 300 · 2 A : 0,15 m = 0,00504 T = <b>5,0 mT</b></div>`},
 {t:'custom', render:simCoilB},
 {t:'mc', id:'s1-f1', q:'In der Formel steht I im Zähler (oben). Was bedeutet das?', opts:['Wenn I doppelt so groß wird, wird B doppelt so groß.','Wenn I doppelt so groß wird, wird B halb so groß.','B hängt nicht von I ab.'], a:0, explain:'Größen im Zähler: B wächst mit ihnen. B ist proportional zu I.'},
 {t:'mc', id:'s1-f2', q:'Die Spule wird doppelt so lang. Die Windungszahl N und die Stromstärke I bleiben gleich. Was passiert mit B?', opts:['B wird halb so groß.','B wird doppelt so groß.','B bleibt gleich.'], a:0, explain:'L steht im Nenner (unten). Doppeltes L → halbes B. Die Windungen liegen weiter auseinander.'},
 {t:'mc', id:'s1-f3', q:'Man verdoppelt N und verdoppelt auch L. I bleibt gleich. Was passiert mit B?', opts:['B bleibt gleich.','B wird doppelt so groß.','B wird viermal so groß.','B wird halb so groß.'], a:0, explain:'Zähler mal 2 und Nenner mal 2 – das hebt sich auf. Die Windungen pro Meter (N/L) bleiben gleich.'},
 {t:'num', id:'s1-f4', q:'Eine Spule hat N = 500 Windungen und ist L = 25 cm lang. Es fließt I = 1,5 A. Berechne B in mT.', a:3.78, unit:'mT', show:'3,78', tol:0.03, hint:'L = 25 cm = 0,25 m. Rechne B in T und dann mal 1000.', explain:'B = 1,26·10⁻⁶ · 500 · 1,5 / 0,25 T = 0,00378 T = 3,78 mT.'},
 {t:'num', id:'s1-f5', q:'Eine Spule hat N = 600 Windungen, L = 20 cm. Es fließt I = 1,6 A. Welchen Wert erwartest du in der Mitte? (in mT)', a:6.05, unit:'mT', show:'6,05', tol:0.03, hint:'L in Meter: 0,20 m.', explain:'B = 1,26·10⁻⁶ · 600 · 1,6 / 0,20 T ≈ 0,00605 T ≈ 6,0 mT.'},
 {t:'num', id:'s1-f6', q:'Ohne Formel: Bei I = 0,5 A misst man B = 1,2 mT. Wie groß ist B bei I = 2,0 A?', a:4.8, unit:'mT', show:'4,8', tol:0.02, hint:'2,0 A ist viermal so viel wie 0,5 A.', explain:'B ~ I: 4-fache Stromstärke → 4-faches Feld: 4 · 1,2 mT = 4,8 mT.'},
 {t:'num', id:'s1-f7', q:'Umstellen: Eine Spule hat N = 1000 Windungen und L = 30 cm. Welche Stromstärke braucht man für B = 10 mT?', a:2.38, unit:'A', show:'2,38', tol:0.03, hint:'I = B · L / (μ₀ · N). B in Tesla: 10 mT = 0,010 T.', explain:'I = 0,010 T · 0,30 m / (1,26·10⁻⁶ T·m/A · 1000) ≈ 2,38 A.'},
 {t:'num', id:'s1-f8', q:'Profi: Eine Spule ist L = 50 cm lang. Bei I = 1,0 A misst man in der Mitte B = 2,5 mT. Wie viele Windungen hat die Spule (ungefähr)?', a:992, unit:'Windungen', show:'≈ 1000', tol:0.04, hint:'N = B · L / (μ₀ · I).', explain:'N = 0,0025 T · 0,50 m / (1,26·10⁻⁶ T·m/A · 1,0 A) ≈ 990 ≈ 1000 Windungen.'},
 {t:'num', id:'s1-f9', q:'Profi: Für Gruppe A (N = 300, L = 0,15 m) gilt B = m · I. Berechne die Steigung m = μ₀ · N / L in mT pro A.', a:2.52, unit:'mT/A', show:'2,52', tol:0.03, hint:'m = 1,26·10⁻⁶ · 300 / 0,15 (in T/A) – dann mal 1000.', explain:'m = 1,26·10⁻⁶ · 300 / 0,15 T/A = 0,00252 T/A = 2,52 mT/A. Die Messung ergab etwa 2,35 mT/A. Das ist etwas weniger, weil die echte Spule nicht unendlich lang ist.'},

 {t:'h2', text:'2.2 Einen Graphen beschreiben', id:'s2-b'},
 {t:'html', html:`<div class="card">
   <p>Wir lesen einen Graphen immer <b>von links nach rechts</b> – so wie die Zeit vergeht.</p>
   <div class="grid2">
    <div>${graph({x:[0,4,1],y:[0,4,1],xl:'t in s',yl:'B',w:220,h:150,ml:34,pts:[[0,0.5],[4,3.5]],noXnum:true,noYnum:true})}<div class="center"><b>steigend</b><br><span class="small">Der Graph geht nach oben. B nimmt zu.</span></div></div>
    <div>${graph({x:[0,4,1],y:[0,4,1],xl:'t in s',yl:'B',w:220,h:150,ml:34,pts:[[0,3.5],[4,0.5]],color:'#c0392b',noXnum:true,noYnum:true})}<div class="center"><b>fallend</b><br><span class="small">Der Graph geht nach unten. B nimmt ab.</span></div></div>
    <div>${graph({x:[0,4,1],y:[0,4,1],xl:'t in s',yl:'B',w:220,h:150,ml:34,pts:[[0,2],[4,2]],color:'#1f9d55',noXnum:true,noYnum:true})}<div class="center"><b>konstant</b><br><span class="small">Der Graph ist waagerecht. B ändert sich nicht.</span></div></div>
    <div>${graph({x:[0,4,1],y:[0,4,1],xl:'t in s',yl:'B',w:220,h:150,ml:34,series:[{pts:[[0,0.5],[4,1.3]],color:'#0b7bc1'},{pts:[[0,0.5],[1.3,3.8]],color:'#6b4fbb'}],noXnum:true,noYnum:true})}<div class="center"><b>steil</b> (lila) und <b>flach</b> (blau)<br><span class="small">Steil = schnelle Änderung.</span></div></div>
   </div>
   <p><b>Satzbausteine</b> <span class="en">(sentence starters)</span>:</p>
   <ul><li>„Der Graph ist <b>zwischen</b> 0 s <b>und</b> 2 s <b>steigend</b>.“</li>
   <li>„<b>Von</b> 2 s <b>bis</b> 5 s ist der Graph <b>konstant</b>.“</li>
   <li>„<b>Zwischen</b> 5 s <b>und</b> 7 s <b>fällt</b> der Graph. B <b>nimmt ab</b>.“</li>
   <li>„<b>Bei</b> t = 2 s hat der Graph einen <b>Hochpunkt</b>.“</li></ul></div>
   <div class="box info"><div class="boxtitle">🧐 Für Profis: „monoton“</div>
   Mathematiker sind sehr genau:<br>
   <b>monoton steigend</b> heißt: Der Graph geht <i>nie nach unten</i>. Er darf aber auch mal waagerecht (konstant) sein.<br>
   <b>streng monoton steigend</b> heißt: Der Graph geht <i>immer nach oben</i>.<br>
   Genauso: <b>(streng) monoton fallend</b>.</div>`},

 {t:'h2', text:'2.3 Steil oder flach? Die Änderungsrate', id:'s2-s'},
 {t:'html', html:`<div class="card">
   <p>Ein <b>steiler</b> Graph bedeutet: B ändert sich <b>schnell</b>. Ein <b>flacher</b> Graph bedeutet: B ändert sich <b>langsam</b>.</p>
   <p>Wie schnell? Das sagt die <b>Änderungsrate</b> <span class="en">(rate of change)</span>:</p>
   <div class="center"><span class="formula small">Änderungsrate = <span class="frac"><span>Änderung von B</span><span>Zeit</span></span></span></div>
   <p><b>Beispiel (Graph 1):</b> Zwischen 0 s und 2 s nimmt B von 1 mT auf 5 mT zu. Die Änderung ist 4 mT. Die Zeit ist 2 s.<br>
   Änderungsrate = 4 mT : 2 s = <b>2 mT pro Sekunde</b> (2 mT/s).</p>
   <p>Wenn der Graph <b>konstant</b> ist, ist die Änderungsrate <b>null</b>.</p></div>

 {t:'vocab', title:'Wörter für den Text', words:[['die Entdeckung','discovery'],['entdecken','to discover'],['der Buchbinder','bookbinder'],['die Nadel (des Kompasses)','(compass) needle'],['der Stromkreis','electric circuit'],['schließen / öffnen','to close / to open'],['zucken','to twitch, to jerk'],['das Notizbuch','notebook'],['verwandeln','to convert, to transform'],['die Legende','legend (story that may not be true)']]},
 {t:'html', html:`<div class="box history"><div class="boxtitle">„Verwandle Magnetismus in Elektrizität!“</div>
  <p><b>Kopenhagen, 1820.</b> Der Physiker Hans Christian Ørsted zeigt seinen Studenten ein Experiment. Ein Strom fließt durch einen Draht. Neben dem Draht liegt ein Kompass. Plötzlich bewegt sich die Kompassnadel! Ørsted entdeckt: <b>Elektrischer Strom erzeugt ein Magnetfeld.</b> (Genau das habt ihr mit der Spule gemessen.)</p>
  <p><b>London.</b> Michael Faraday liest von dieser Entdeckung. Faraday kommt aus einer armen Familie. Er geht nur wenige Jahre zur Schule. Mit 14 Jahren lernt er den Beruf <b>Buchbinder</b>. Er liest die Bücher, die er bindet – am liebsten Bücher über Naturwissenschaften. Später wird er Assistent an der <i>Royal Institution</i> in London.</p>
  <p>Faraday denkt: Strom macht ein Magnetfeld. Kann dann ein Magnetfeld auch Strom machen? In sein Notizbuch schreibt er: <i>„Convert magnetism into electricity.“</i> – Verwandle Magnetismus in Elektrizität!</p>
  <p>Viele Jahre probiert er es. Er legt einen starken Magneten neben eine Spule – nichts passiert.</p>
  <p><b>29. August 1831.</b> Faraday wickelt zwei Spulen auf einen Eisenring. Die erste Spule verbindet er mit einer Batterie. Die zweite Spule verbindet er mit einem Strommessgerät. Er schließt den Stromkreis der ersten Spule. Die Nadel des Messgeräts <b>zuckt kurz</b> – und geht dann zurück auf null! Er öffnet den Stromkreis: Die Nadel zuckt wieder, aber <b>in die andere Richtung</b>.</p>
  <p>Faraday versteht: Ein <b>konstantes</b> Magnetfeld erzeugt keinen Strom. Nur wenn sich das Magnetfeld <b>ändert</b>, gibt es Strom. Wenige Wochen später schiebt er einen Stabmagneten in eine Spule hinein und wieder heraus – und misst wieder Strom. Dann baut er den ersten <b>Generator</b>: eine Kupferscheibe, die sich zwischen den Polen eines Magneten dreht.</p>
  <p>Eine bekannte Geschichte (vielleicht nur eine <b>Legende</b>): Ein Politiker fragt Faraday: „Wozu ist das nützlich?“ Faraday antwortet: „Eines Tages, Sir, werden Sie darauf Steuern verlangen.“</p>
  <p>Heute erzeugen Generatoren den größten Teil der elektrischen Energie auf der Welt.</p></div>`},

 {t:'h2', text:'3.3 Induktion durch Bewegung', id:'s3-b'},
 {t:'html', html:`<div class="card">
  <p><b>Erzeugung von Spannung.</b> Ein Beispiel für einen Generator ist der <b>Fahrraddynamo</b>. Er hat eine <b>feststehende Spule</b> und einen <b>drehbaren Dauermagneten</b>. Wir schließen ein Spannungsmessgerät an die Spule an. Wir drehen am Antriebsrad. Das Messgerät zeigt eine Spannung! Es reicht also, den Magneten in der Spule zu drehen.</p>
  <p>Physiker sagen nicht „eine Spannung entsteht“. Sie sagen: <b>„Eine Spannung wird induziert.“</b></p>
  <p><b>Der Versuch:</b> Wir nehmen eine Spule, einen Stabmagneten und ein Spannungsmessgerät.</p>
  <ul><li>Wir bewegen den Magneten <b>in die Spule hinein</b>: Das Messgerät zeigt eine Spannung.</li>
  <li>Wir ziehen den Magneten <b>heraus</b>: Wieder eine Spannung – aber der Zeiger geht in die <b>andere Richtung</b>. Das <b>Vorzeichen</b> der Spannung hat sich umgekehrt.</li>
  <li>Der Magnet <b>liegt still</b> in der Spule: <b>Keine</b> Spannung!</li>
  <li>Wir bewegen den Magneten <b>schneller</b>: Der Zeigerausschlag ist <b>größer</b>.</li>
  <li>Wir halten den Magneten fest und bewegen die <b>Spule</b>: Auch dann wird eine Spannung induziert.</li></ul>
  <p>👉 Probiere alles in der Simulation aus!</p></div>`},

 {t:'mc', id:'s3-b3', q:'Wie kannst du eine größere Spannung induzieren?', opts:['Den Magneten schneller bewegen.','Eine Spule mit mehr Windungen nehmen.','Einen stärkeren Magneten nehmen.','Den Magneten langsamer bewegen.','Den Magneten still in die Spule legen.'], a:[0,1,2],
   explain:'Schnellere Bewegung, mehr Windungen und ein stärkerer Magnet ergeben eine größere Spannung. (Teste Windungen in der Simulation!)'},
 {t:'mc', id:'s3-b4', q:'Man hält den Magneten fest und bewegt die Spule über den Magneten. Wird eine Spannung induziert?', opts:['Ja. Es kommt nur auf die relative Bewegung von Magnet und Spule an.','Nein. Nur der Magnet darf sich bewegen.','Nein. Die Spule muss immer stillstehen.'], a:0, explain:'Wichtig ist: Magnet und Spule bewegen sich relativ zueinander. Wer sich bewegt, ist egal.'},
 {t:'mc', id:'s3-b5', q:'Du drehst den Magneten um (N und S tauschen) und schiebst ihn wieder in die Spule. Was ändert sich?', opts:['Das Vorzeichen der Spannung.','Nichts.','Es gibt keine Spannung mehr.'], a:0, explain:'Probiere es in der Simulation: Mit umgedrehtem Magneten zeigt der Zeiger in die andere Richtung.'},
 {t:'heft', id:'s3-heft1', foto:'MS1', text:'Wenn sich ein Magnet und eine Spule relativ zueinander bewegen, dann wird eine Spannung induziert.<br>Das Vorzeichen der Spannung hängt von der Bewegungsrichtung ab.<br>Je schneller die Bewegung ist, desto größer ist die Spannung.', src:'Merksatz 1 von 3'},
 {t:'mc', id:'s3-b6', label:'Denkaufgabe', q:'Ein Stabmagnet wird <b>durch</b> eine Spule hindurchgeschoben (rein – durch – raus). Wie ändert sich die Anzeige des Spannungsmessgeräts?',
   opts:['Zuerst schlägt der Zeiger in eine Richtung aus. In der Mitte geht er kurz auf null. Dann schlägt er in die andere Richtung aus.','Der Zeiger zeigt die ganze Zeit in dieselbe Richtung.','Der Zeiger bleibt die ganze Zeit bei null.','Der Zeiger schlägt nur in der Mitte der Spule aus.'], a:0,
   explain:'Beim Hineinbewegen wird das Feld in der Spule stärker (z. B. +). Ganz in der Mitte ändert es sich kurz nicht (0). Beim Herauskommen wird es schwächer (−). Teste es in der Simulation mit „langsam durch die Spule“!'},

 {t:'h2', text:'3.4 Drehung der Spule im Magnetfeld', id:'s3-d'},
 {t:'html', html:`<div class="card">
  <p>Wir stellen eine Spule mit vielen Windungen auf einen <b>Drehteller</b>. Wir schließen ein Spannungsmessgerät an. Als Magnetfeld nehmen wir das <b>Magnetfeld der Erde</b>.</p>
  <p>Wir <b>drehen</b> die Spule. Das Messgerät zeigt eine Spannung. Der Zeiger zeigt <b>abwechselnd nach rechts und nach links</b>. Die Spannung ist also nicht konstant.</p>
  <p>Mit einem Computer (Messwerterfassung) zeichnen wir die Spannung über der Zeit auf:</p>
  ${graph({x:[0,4,1], y:[-1.5,1.5,0.5], xl:'t', yl:'U', w:420, h:200, fn:null, series:[{fn:t=>Math.sin(Math.PI*t/1.5), color:'#c0392b'}], noXnum:true, noYnum:true, caption:'Wechselspannung: Die Spannung ist über der Zeit dargestellt.'})}
  <p>Die Spannung ist abwechselnd <b>positiv</b> und <b>negativ</b>. Das passiert immer wieder. Man nennt das eine <b>Wechselspannung</b>.</p>
  <p>Eine Batterie liefert dagegen eine <b>Gleichspannung</b>: Das Vorzeichen bleibt immer gleich.</p></div>`},
 {t:'custom', render:simRotate},
 {t:'heft', id:'s3-heft2', foto:'MS2', text:'Wenn eine Spule in einem Magnetfeld gedreht wird, dann wird eine Wechselspannung induziert.', src:'Merksatz 2 von 3'},
 {t:'mc', id:'s3-d1', q:'Was ist eine Wechselspannung?', opts:['Eine Spannung, die immer wieder ihr Vorzeichen wechselt (+, −, +, −, …).','Eine Spannung, die immer gleich groß ist.','Eine Spannung, die nur positiv ist.'], a:0, explain:'Wechselspannung: abwechselnd positiv und negativ. Aus der Steckdose kommt Wechselspannung.'},
 {t:'mc', id:'s3-d2', q:'Welche Spannung liefert eine Batterie?', opts:['Gleichspannung','Wechselspannung','Gar keine Spannung'], a:0, explain:'Bei einer Batterie bleiben + und − immer gleich: Gleichspannung.'},
 {t:'mc', id:'s3-d3', q:'In der Simulation: Wann ist die Spannung U genau null?', opts:['Wenn die Anzahl der Feldlinien durch die Spule am größten oder am kleinsten ist.','Wenn die Anzahl der Feldlinien null ist.','Die Spannung ist nie null.'], a:0,
   explain:'Am Hochpunkt und Tiefpunkt ändert sich die Anzahl der Feldlinien für einen Moment nicht (der Graph ist waagerecht). Dann ist U = 0. Wenn die Spule „auf der Kante“ steht (0 Feldlinien), ändert sich die Anzahl am schnellsten – dort ist U am größten!'},

 {t:'h2', text:'3.5 Das Magnetfeld ändert sich – Induktion ohne Bewegung', id:'s3-m'},
 {t:'html', html:`<div class="card">
  <p>Bis jetzt haben wir immer etwas <b>bewegt</b>: die Spule oder den Magneten. Was ist gemeinsam? <b>Das Magnetfeld in der Spule ändert sich!</b></p>
  <ul><li>Magnet <b>hinein</b>: Das Feld in der Spule wird <b>stärker</b> → Spannung.</li>
  <li>Magnet <b>heraus</b>: Das Feld in der Spule wird <b>schwächer</b> → Spannung mit umgekehrtem Vorzeichen.</li>
  <li>Magnet <b>still</b>: Das Feld ändert sich nicht → keine Spannung.</li>
  <li>Spule <b>drehen</b>: Die Richtung des Feldes relativ zur Spule ändert sich ständig. Die Stärke des Feldes bleibt gleich. Trotzdem wird eine Spannung induziert.</li></ul>
  <p>Wir schließen daraus: Es kommt auf die <b>Änderung des Magnetfeldes in der Spule</b> an. Das prüfen wir mit einem neuen Versuch.</p>
  <p><b>Induktion ohne Bewegung:</b> Wir stellen einen <b>Elektromagneten</b> neben eine Spule (Induktionsspule). An die Spule schließen wir ein Spannungsmessgerät an. Nichts bewegt sich!</p>
  <ul><li>Wir <b>schließen den Schalter</b>: Der Strom im Elektromagneten erzeugt ein Magnetfeld. Das Messgerät zeigt <b>kurz</b> eine Spannung, danach nicht mehr.</li>
  <li>Wir <b>öffnen den Schalter</b>: Wieder kurz eine Spannung, aber mit <b>umgekehrtem Vorzeichen</b>.</li>
  <li>Wir <b>erhöhen die Stromstärke</b> im Elektromagneten: Das Feld wird stärker. <b>Während</b> das Feld stärker wird, wird eine Spannung induziert.</li></ul>
  <p>Erinnerst du dich an Sitzung 1? <b>B ~ I</b>. Wenn sich die Stromstärke im Elektromagneten ändert, ändert sich auch sein Magnetfeld!</p></div>`},
 {t:'heft', id:'s3-heft3', foto:'MS3', text:'Wenn sich in einer Spule das Magnetfeld ändert, dann wird eine Spannung induziert.<br>Ist das Feld konstant, dann gibt es keine Induktionsspannung.', src:'Merksatz 3 von 3'},
 {t:'mc', id:'s3-m1', q:'Der Schalter ist schon lange geschlossen. Im Elektromagneten fließt ein konstanter Strom. Was zeigt das Messgerät an der Induktionsspule?', opts:['0 – das Magnetfeld ist konstant.','Eine große Spannung – das Magnetfeld ist stark.','Eine Wechselspannung.'], a:0, explain:'Ein starkes, aber konstantes Feld induziert keine Spannung. Es kommt nur auf die Änderung an.'},
 {t:'mc', id:'s3-m2', q:'Wann wird in der Induktionsspule eine Spannung induziert?', opts:['Beim Schließen des Schalters.','Beim Öffnen des Schalters.','Während man die Stromstärke im Elektromagneten erhöht.','Während ein konstanter Strom fließt.','Wenn der Schalter die ganze Zeit offen ist.'], a:[0,1,2],
   explain:'Immer dann, wenn sich der Strom im Elektromagneten – und damit das Magnetfeld – ändert.'},
 {t:'cloze', id:'s3-m3', q:'Ergänze die Erklärung.', lines:[
   'Beim Schließen des Schalters wird das Magnetfeld in der Spule {*stärker|schwächer}. Es wird eine Spannung induziert.',
   'Beim Öffnen wird das Magnetfeld {stärker|*schwächer}. Die Spannung hat jetzt {das gleiche|*das umgekehrte} Vorzeichen.',
   'Bei konstantem Strom ist auch das Magnetfeld {*konstant|steigend}. Es gibt {eine|*keine} Induktionsspannung.']},

 {t:'h2', text:'3.6 Eine Veranschaulichung mit Feldlinien', id:'s3-f'},
 {t:'html', html:`<div class="card">
  <p>Wir beschreiben das Magnetfeld mit <b>Feldlinien</b>:</p>
  <ul><li>Die <b>Richtung</b> einer Feldlinie zeigt die Richtung des Magnetfeldes.</li>
  <li>Die <b>Anzahl</b> der Feldlinien in einem Bereich zeigt die <b>Stärke</b> des Feldes. Viele Linien = starkes Feld.</li></ul>
  <p>Wir zeichnen die Feldlinien <b>senkrecht zum Papier</b>:</p>
  <div class="fieldpics">${fieldPic({cols:1,rows:1,cell:40,field:ALL})}<div>⊗ <b>Kreuz</b>: Die Feldlinie geht <b>in das Papier hinein</b>.<br><span class="small">(Wie das Ende eines Pfeils, der wegfliegt.)</span></div>
  ${fieldPic({cols:1,rows:1,cell:40,field:ALL,sym:'dot'})}<div>⊙ <b>Punkt</b>: Die Feldlinie kommt <b>aus dem Papier heraus</b>.<br><span class="small">(Wie die Spitze eines Pfeils, der auf dich zukommt.)</span></div></div>
  <p>Die Spule hat hier <b>eine Windung</b> (roter Rahmen, dunkelblau gefüllt). Wir <b>zählen die Feldlinien in der Spule</b>.</p>
  <div class="box merke" style="margin-bottom:0"><b>Die Regel:</b> Ändert sich die <b>Anzahl der Feldlinien durch die Spule</b>, dann wird eine Spannung induziert. Bleibt die Anzahl gleich, dann nicht. <br>Es ist egal, <i>wie</i> sich die Anzahl ändert: Feld stärker/schwächer, Spule bewegt, Feld bewegt, Spule gedreht …</div></div>`},
 {t:'h3', text:'Bild A: Das Magnetfeld wird schwächer'},
 {t:'html', html:pair(fp('A1','vorher'), fp('A2','nachher'))},
 {t:'cloze', id:'s3-f1', q:'Zähle die Feldlinien in der Spule (Bild A).', lines:[
   `Vorher gehen {*${nA1}|${nA2}|${nA1+4}} Feldlinien durch die Spule.`,
   `Nachher gehen {${nA1}|*${nA2}|${nA2+4}} Feldlinien durch die Spule.`,
   'Die Anzahl der Feldlinien {nimmt zu|*nimmt ab|bleibt gleich}.',
   'Also wird {*eine Spannung|keine Spannung} induziert.'], explain:`Vorher ${nA1}, nachher ${nA2} Feldlinien. Das Feld wird schwächer → die Anzahl ändert sich → Induktionsspannung.`},
 {t:'h3', text:'Bild B: Die Spule bewegt sich aus dem Feld heraus'},
 {t:'html', html:pair(fp('B1','vorher'), fp('B2','nachher'))},
 {t:'cloze', id:'s3-f2', q:'Zähle wieder (Bild B).', lines:[
   `Vorher: {*${nB1}|${nB2}|0} Feldlinien. Nachher: {${nB1}|*${nB2}|0} Feldlinien.`,
   'Die Stärke des Feldes {hat sich geändert|*hat sich nicht geändert}.',
   'Die Anzahl der Feldlinien in der Spule {*ändert sich|ändert sich nicht}. Also: {*Spannung|keine Spannung}.'],
   explain:'Das Feld ist gleich stark. Aber ein Teil der Spule ist jetzt außerhalb des Feldes. Es gehen weniger Feldlinien durch die Spule → Spannung. Ob sich die Spule oder das Feld bewegt, ist egal.'},
 {t:'h3', text:'Bild C: Die Spule bewegt sich im Feld'},
 {t:'html', html:pair(fp('C1','vorher'), fp('C2','nachher'))},
 {t:'mc', id:'s3-f3', q:`Bild C: Die Spule bewegt sich innerhalb des Feldes. Vorher und nachher gehen ${nC1} Feldlinien durch die Spule. Wird eine Spannung induziert?`, opts:['Nein. Die Anzahl der Feldlinien in der Spule bleibt gleich.','Ja. Die Spule bewegt sich.','Ja, weil das Feld sehr stark ist.'], a:0,
   explain:'Bewegung allein reicht nicht! Nur wenn sich die Anzahl der Feldlinien durch die Spule ändert, wird eine Spannung induziert.'},
 {t:'mc', id:'s3-f4', label:'Feldlinien-Bild 1', q:'Welches Bild zeigt: <b>Das Magnetfeld in der Spule nimmt zu</b>?', graphs:true, opts:[
   pairV(fieldPic({...FP.A2,cell:14,meter:false}), fieldPic({...FP.A1,cell:14,meter:false})),
   pairV(fieldPic({...FP.A1,cell:14,meter:false}), fieldPic({...FP.A2,cell:14,meter:false})),
   pairV(fieldPic({...FP.C1,cell:14,meter:false}), fieldPic({...FP.C2,cell:14,meter:false}))], a:0,
   explain:'Vorher wenige Feldlinien, nachher viele: Das Feld in der Spule nimmt zu.'},
 {t:'mc', id:'s3-f5', label:'Feldlinien-Bild 2', q:'„Induktion ohne Bewegung“: Ein Elektromagnet wird eingeschaltet. Welches Bildpaar passt?', graphs:true, opts:[
   pairV(fieldPic({...FP.D0,cell:14,meter:false}), fieldPic({...FP.A1,cell:14,meter:false})),
   pairV(fieldPic({...FP.B1,cell:14,meter:false}), fieldPic({...FP.B2,cell:14,meter:false})),
   pairV(fieldPic({...FP.C1,cell:14,meter:false}), fieldPic({...FP.C2,cell:14,meter:false}))], a:0,
   explain:'Die Spule bleibt an ihrem Platz. Vorher gibt es kein Feld, nach dem Einschalten viele Feldlinien. Die Anzahl ändert sich ohne Bewegung.'},
 {t:'html', html:`<div class="card"><p><b>Drehung (wie in der Simulation oben):</b> Dreht sich die Spule, dann ändert sich die Anzahl der Feldlinien durch die Spule ständig: z. B. 9 Linien, kurz danach nur noch 3. Es wird ständig eine Spannung induziert. Nach einer halben Umdrehung gehen die Feldlinien von der <b>anderen Seite</b> durch die Spule. Darum kehrt sich das Vorzeichen um → <b>Wechselspannung</b>.</p></div>`},
 {t:'mc', id:'s3-f6', q:'Eine Spule wird beobachtet. Anzahl der Feldlinien durch die Spule: <br><b>0 s: 9 &nbsp;|&nbsp; 1 s: 9 &nbsp;|&nbsp; 2 s: 6 &nbsp;|&nbsp; 3 s: 3 &nbsp;|&nbsp; 4 s: 3</b><br>In welchen Zeiträumen wird eine Spannung induziert?', opts:['zwischen 0 s und 1 s','zwischen 1 s und 2 s','zwischen 2 s und 3 s','zwischen 3 s und 4 s'], a:[1,2], noShuffle:true,
   explain:'Nur von 1 s bis 3 s ändert sich die Anzahl (9 → 6 → 3).'},

 {t:'h2', text:'3.7 Graphen lesen: Wann wird eine Spannung induziert?', id:'s3-g'},
 {t:'html', html:`<div class="box merke"><div class="boxtitle">Jetzt brauchst du Sitzung 2!</div>
  Der Graph zeigt das Magnetfeld B in der Spule (oder die Anzahl der Feldlinien) über der Zeit t.<ul>
  <li>Graph <b>steigend</b> → Induktionsspannung (z. B. positiv).</li>
  <li>Graph <b>fallend</b> → Induktionsspannung mit <b>umgekehrtem Vorzeichen</b>.</li>
  <li>Graph <b>konstant</b> → <b>keine</b> Induktionsspannung – auch wenn B groß ist!</li>
  <li>Graph <b>steiler</b> → Spannung <b>größer</b>.</li></ul></div>
  <div class="card">${graph({x:[0,6,1], y:[0,3,1], xl:'t in s', yl:'I in A', w:460, h:230, pts:[[0,0],[1,0],[1.2,2],[4,2],[4.2,0],[6,0]], caption:'Graph E: Stromstärke I im Elektromagneten'})}</div>`},
 {t:'mc', id:'s3-g1', q:'Graph E: Wann wird in der Induktionsspule neben dem Elektromagneten eine Spannung induziert?', opts:['kurz bei t = 1 s (Einschalten)','zwischen 2 s und 4 s','kurz bei t = 4 s (Ausschalten)','zwischen 5 s und 6 s'], a:[0,2], noShuffle:true,
   explain:'Nur beim Ein- und Ausschalten ändert sich I (und damit B). Zwischen 1,2 s und 4 s ist I konstant (2 A) – keine Spannung.'},
 {t:'html', html:`<div class="card">${graph({x:[0,10,1], y:[0,5,1], xl:'t in s', yl:'B in mT', w:480, h:250, pts:[[0,0],[2,4],[4,4],[5,0],[8,0],[10,2]], caption:'Graph F: Magnetfeld B in einer Spule'})}</div>`},
 {t:'mc', id:'s3-g2', q:'Graph F: In welchen Intervallen wird eine Spannung induziert?', opts:['0 s bis 2 s','2 s bis 4 s','4 s bis 5 s','5 s bis 8 s','8 s bis 10 s'], a:[0,2,4], noShuffle:true,
   explain:'Steigend (0–2 s), fallend (4–5 s) und steigend (8–10 s): Spannung. Konstant (2–4 s und 5–8 s): keine Spannung.'},
 {t:'mc', id:'s3-g3', q:'Graph F: Wo ist der <b>Betrag</b> der Spannung am größten?', opts:['4 s bis 5 s','0 s bis 2 s','8 s bis 10 s','2 s bis 4 s'], a:0,
   explain:'4–5 s: B ändert sich um 4 mT in 1 s (4 mT/s) – am steilsten. 0–2 s: 2 mT/s. 8–10 s: 1 mT/s.'},
 {t:'cloze', id:'s3-g4', q:'Graph F: Zwischen 0 s und 2 s ist die Spannung positiv. Ergänze.', lines:[
   'Zwischen 4 s und 5 s ist die Spannung {positiv|*negativ|null}.',
   'Zwischen 5 s und 8 s ist die Spannung {positiv|negativ|*null}.',
   'Zwischen 8 s und 10 s ist die Spannung {*positiv|negativ|null}.',
   'Zwischen 2 s und 4 s ist B groß, aber die Spannung ist {*null|sehr groß}, weil B {*konstant|steigend} ist.'],
   explain:'Steigend wie bei 0–2 s → positiv. Fallend → negativ. Konstant → null.'},
 {t:'mc', id:'s3-g5', q:'Das Magnetfeld B in einer Spule ändert sich so:<br>'+graph({x:[0,10,1], y:[0,6,1], xl:'t in s', yl:'B in mT', w:400, h:210, pts:G1})+'Welcher Graph zeigt die induzierte Spannung U?', graphs:true,
   opts:[uopt10([[0,2],[2,2],[2,0],[5,0],[5,-2],[7,-2],[7,0],[10,0]]), uopt10([[0,0.6],[2,2.6],[5,2.6],[7,0.6],[10,0.6]]), uopt10([[0,0],[2,0],[2,2],[5,2],[5,0],[10,0]]), uopt10([[0,-2],[2,-2],[2,0],[5,0],[5,-2],[7,-2],[7,0],[10,0]])], a:0,
   explain:'Steigend → Spannung (+). Konstant → 0. Fallend → Spannung (−). Achtung: Der Graph von U sieht ganz anders aus als der Graph von B!'},
 {t:'mc', id:'s3-g6', q:'Welche Aussage ist <b>falsch</b>?', opts:['Ein starkes Magnetfeld induziert immer eine große Spannung.','Wenn B konstant ist, gibt es keine Induktionsspannung.','Wenn B schneller steigt, ist die Spannung größer.','Steigendes und fallendes B ergeben unterschiedliche Vorzeichen.'], a:0,
   explain:'Falsch: Ein starkes, aber konstantes Feld induziert gar keine Spannung. Es kommt nur auf die Änderung an.'},

 {t:'h2', text:'3.8 Versuche und Aufgaben', id:'s3-mat'},
 {t:'html', html:`<div class="box material"><div class="boxtitle">🔬 Versuche: Erkundung der Induktion</div>
  <b>V1 Induktion durch Bewegung.</b> Material: Stabmagnet, Spulen mit unterschiedlichen Windungszahlen, Spannungsmessgerät mit mV-Bereich und Nullpunkt in der Mitte.<br>
  a) Bewege den Magneten ruckartig in die Spule hinein und heraus. b) Untersuche, wovon das Vorzeichen und der Betrag der Spannung abhängen.<br><br>
  <b>V2 Induktion durch Drehung.</b> Material: Hufeisenmagnet, Spule mit 500 Windungen, U-förmiger Eisenkern, Schnur, Spannungsmessgerät.<br>
  a) Der Hufeisenmagnet hängt an einer Schnur über dem U-Kern. Drehe den Magneten. Gleich- oder Wechselspannung? b) Wie erzeugst du eine möglichst große Spannung?</div>`},
 {t:'mc', id:'s3-v1a', label:'V1 b', q:'Wovon hängt das <b>Vorzeichen</b> der Spannung ab?', opts:['von der Bewegungsrichtung (hinein oder heraus)','davon, welcher Pol (N oder S) zur Spule zeigt','von der Farbe des Magneten','von der Länge der Kabel'], a:[0,1],
   explain:'Richtung der Bewegung und Polung des Magneten bestimmen das Vorzeichen.'},
 {t:'mc', id:'s3-v1b', label:'V1 b', q:'Wovon hängt der <b>Betrag</b> der Spannung ab?', opts:['von der Geschwindigkeit der Bewegung','von der Windungszahl der Spule','von der Stärke des Magneten','von der Richtung der Bewegung (hinein/heraus)'], a:[0,1,2],
   explain:'Schneller, mehr Windungen, stärkerer Magnet → größere Spannung. Die Richtung ändert nur das Vorzeichen.'},
 {t:'mc', id:'s3-v2a', label:'V2 a', q:'Der Hufeisenmagnet dreht sich über der Spule. Welche Spannung wird induziert?', opts:['Wechselspannung','Gleichspannung','Keine Spannung'], a:0,
   explain:'Bei jeder halben Drehung ist der andere Pol über dem Kern. Das Feld in der Spule wechselt die Richtung → Wechselspannung. So funktioniert auch der Fahrraddynamo.'},
 {t:'mc', id:'s3-v2b', label:'V2 b', q:'Wie erzeugst du eine möglichst große Spannung?', opts:['Den Magneten schnell drehen.','Einen starken Magneten nehmen.','Eine Spule mit vielen Windungen und Eisenkern nehmen.','Den Magneten weit weg von der Spule hängen.','Den Magneten sehr langsam drehen.'], a:[0,1,2],
   explain:'Schnelle Änderung, starkes Feld, viele Windungen, Eisenkern → große Spannung.'},

 {t:'h3', text:'Material A: Viele Möglichkeiten zur Induktion'},
 {t:'html', html:`<div class="card center">${A1PIC}<div class="caption">Aufbau (vereinfacht): Die linke Spule hängt am Netzgerät (mit Drehknopf für die Stromstärke). Die rechte Spule hängt am Spannungsmessgerät. Beide Spulen sitzen auf einem Eisenkern.</div></div>`},
 {t:'mc', id:'s3-A1a', label:'A1 a', q:'Mit welchen Aktionen kann man in der rechten Spule eine Spannung induzieren?', opts:[
   'Das Netzgerät einschalten.','Das Netzgerät ausschalten.','Die Stromstärke am Drehknopf größer machen.','Die Stromstärke am Drehknopf kleiner machen.',
   'Die rechte Spule vom Eisenkern wegziehen.','Das Joch (oberes Eisenstück) abnehmen.','Einen konstanten Strom fließen lassen und nichts verändern.','Das Messgerät auf einen anderen Messbereich stellen.'], a:[0,1,2,3,4,5],
   explain:'Bei allen diesen Aktionen ändert sich das Magnetfeld in der rechten Spule. Bei konstantem Strom (ohne Änderung) gibt es keine Spannung.'},

 {t:'html', html:`<div class="box merke"><div class="boxtitle">✅ Zusammenfassung Sitzung 3</div>
  <ul><li>Eine Spannung wird <b>induziert</b>, wenn sich das <b>Magnetfeld in der Spule ändert</b> (die Anzahl der Feldlinien durch die Spule).</li>
  <li>Wie die Änderung passiert, ist egal: Magnet bewegen, Spule bewegen, Spule drehen, Strom im Elektromagneten ändern …</li>
  <li>Konstantes Feld → keine Spannung. Schnellere Änderung → größere Spannung. Umgekehrte Änderung → umgekehrtes Vorzeichen.</li>

  <div class="heft" style="border-style:solid"><div class="htitle">✍️ Alle Merksätze – stehen sie in deinem Heft? Hast du alle drei fotografiert? 📷</div>
  <ol class="htext" style="font-size:1rem"><li>Wenn sich ein Magnet und eine Spule relativ zueinander bewegen, dann wird eine Spannung induziert. Das Vorzeichen der Spannung hängt von der Bewegungsrichtung ab. Je schneller die Bewegung ist, desto größer ist die Spannung.</li>

  <li>Wenn sich in einer Spule das Magnetfeld ändert, dann wird eine Spannung induziert. Ist das Feld konstant, dann gibt es keine Induktionsspannung.</li></ol></div>
  <p class="saveHint">💾 <b>Speichere jetzt deinen Fortschritt!</b></p></div>`}

  document.body.innerHTML = `

    <span class="cstat" id="cloudStatus"></span>
    <button class="tbtn alt" id="btnSave">💾 Speichern</button>
    <button class="tbtn" id="btnLoad">📂 Laden</button>

  <div id="tabs">${SESSIONS.map(s=>`<button data-p="${s.id}">${s.tab}${s.id!=='sum'?'<span class="tabstars"></span>':''}</button>`).join('')}</div>
  <div id="unsaved">⚠ Du hast neue Sterne, die noch nicht gespeichert sind. → 💾 Speichern</div>
  </div>
  <main>
    <div id="backupBanner"></div>
    ${SESSIONS.map(s=>`<section class="page" id="page_${s.id}"></section>`).join('')}
  </main>
  <div id="modal"><div class="mbox"><button class="mclose" aria-label="Schließen">×</button><div class="mcontent"></div></div></div>
  <div id="toast"></div>`;
  $('#btnSave').onclick=saveDialog; $('#btnLoad').onclick=loadDialog;
  if(CLOUD_ON){ $('#btnLoad').textContent='🚪 Abmelden'; $('#btnLoad').onclick=()=>doLogout(null); }
  $('#unsaved').onclick=saveDialog; $('#unsaved').style.cursor='pointer';
  $('#modal .mclose').onclick=closeModal;
  $('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
  $$('#tabs button').forEach(b=>b.onclick=()=>showPage(b.dataset.p));
}
function showPage(id, noScroll){
  $$('.page').forEach(p=>p.classList.toggle('active', p.id==='page_'+id));
  $$('#tabs button').forEach(b=>b.classList.toggle('active', b.dataset.p===id));
  try{ localStorage.setItem(APP_KEY+'_tab', id); }catch(e){}
  if(!noScroll) window.scrollTo(0,0);
}

   <li>Am Ende der Stunde: oben auf <b>🚪 Abmelden</b> tippen. <span class="en">(abmelden = log out)</span></li></ul>

function buildTraining(){
  if(CLOUD_ON) return buildWelcome();
  const p=$('#page_t');
  const canShare = !!(navigator.canShare && window.File);
  p.innerHTML = `
   <h1>Start: Sterne sammeln und speichern üben</h1>
   <p class="lead">Bevor wir mit Physik anfangen, üben wir das <b>Speichern</b> und <b>Laden</b>. Das ist wichtig! <span class="en">(practise saving and loading first)</span></p>
   <div class="box warn"><div class="boxtitle">Warum?</div>Diese Seite vergisst deine Sterne vielleicht, wenn du sie schließt. Darum gilt:<br>
   📂 <b>Am Anfang jeder Stunde: Laden.</b> &nbsp; 💾 <b>Am Ende jeder Stunde: Speichern.</b></div>
   <div class="starstage" id="tStage"></div>

   <div class="step" id="st1"><div class="sn">1</div><div class="sbody"><h3>Name eingeben und ersten Stern holen</h3>
     <p><input class="name" id="nameInput" placeholder="Vorname Nachname" autocomplete="name"></p>
     <label class="trainbox"><input type="checkbox" id="tCheck"> Ich bin bereit! Gib mir meinen ersten Stern. ⭐</label>
     <div class="small" id="tNameMsg"></div></div></div>

   <div class="step" id="st2"><div class="sn">2</div><div class="sbody"><h3>Fortschritt speichern</h3>
     <p>Speichere jetzt deinen Stern. Wähle <b>einen</b> Weg:</p>
     <button class="bigbtn" id="tSaveFile">💾 Als Datei speichern</button>
     ${canShare?'<button class="bigbtn gray" id="tShare">📤 Teilen / In Dateien sichern</button>':''}
     <button class="bigbtn gray" id="tCopy">📋 Code kopieren</button>
     <div class="small" style="margin-top:6px"><b>iPad:</b> Tippe auf „Laden“. Die Datei ist dann in der App <b>Dateien</b> → <b>Downloads</b>. &nbsp;<b>Laptop:</b> Ordner <b>Downloads</b>.<br>
     <b>Code:</b> Füge den Code in Notizen / OneNote ein (lange auf das Feld tippen → Einsetzen).</div>
     <textarea class="code" id="tCode" readonly placeholder="Hier erscheint der Code, wenn du „Code kopieren“ drückst."></textarea>
     <div class="okmsg" id="tSaveMsg"></div></div></div>

   <div class="step" id="st3"><div class="sn">3</div><div class="sbody"><h3>Fortschritt löschen</h3>
     <p>Jetzt tun wir so, als ob die Seite alles vergessen hat. Drücke auf <b>Löschen</b>. Dein Stern verschwindet!</p>
     <button class="bigbtn red" id="tErase">🗑 Fortschritt löschen</button>
     <div class="small" id="tEraseMsg"></div></div></div>

   <div class="step" id="st4"><div class="sn">4</div><div class="sbody"><h3>Fortschritt laden</h3>
     <p>Hol dir deinen Stern zurück! Lade deine Datei <b>oder</b> füge deinen Code ein.</p>
     <p><b>Datei:</b> <input type="file" id="tFile" accept=".txt,text/plain,.json,application/json"></p>
     <div class="small">iPad: „Durchsuchen“ → <b>Downloads</b> → Datei <i>Induktion_…txt</i> antippen.</div>
     <p><b>Code:</b></p><textarea class="code" id="tPaste" placeholder="Code hier einfügen (beginnt mit IND9-…)"></textarea>
     <button class="bigbtn gray" id="tPasteBtn">Code laden</button>
     <div class="loaderr errmsg"></div></div></div>

   <div class="step" id="st5"><div class="sn">5</div><div class="sbody"><h3>Geschafft – noch einmal speichern!</h3>
     <p>Du bist jetzt <b>Speicher-Profi</b> und hast dafür einen zweiten Stern bekommen. Dieser Stern ist aber noch nicht gespeichert. Speichere also noch einmal!</p>
     <button class="bigbtn green" id="tSave2">💾 Noch einmal speichern</button>
     <button class="bigbtn gray" id="tGo">Weiter zu Sitzung 1 ➜</button></div></div>

   <div class="box info"><div class="boxtitle">🆘 Probleme beim Speichern?</div>
   <ul><li><b>Öffne die Seite im Browser</b> (Safari, Chrome, Edge) – nicht in einer Vorschau. In einer Vorschau funktionieren die Knöpfe nicht.</li>
   <li>Nimm beim Laden immer die <b>neueste</b> Datei (das Datum steht im Namen). Heißt die Datei „… (1).txt“? Kein Problem – das geht auch.</li>
   <li>Datei klappt nicht? Nimm den <b>Code</b> und speichere ihn in Notizen oder OneNote.</li>
   <li>Beim Laden gehen <b>nie</b> Sterne verloren. Die Sterne aus der Datei kommen dazu.</li>

  };

  ORDER.push('t-1','t-2');
  REFRESHERS.push(()=>{ $('#tCheck').checked=!!STATE.solved['t-1']; ni.value=STATE.name||''; });
}
function onLoadedForTraining(){
  if(TRAIN.erased && STATE.solved['t-1'] && !STATE.solved['t-2']){
    TRAIN.erased=false;
    setTimeout(()=>{ awardStar('t-2', $('#tStage')); toast('🎉 Super! Dein Stern ist zurück. Du bist jetzt Speicher-Profi: +1 ⭐', 4500); renderTraining(); }, 600);
  }
}
function renderTraining(){
  if(!$('#st1')) return;
  const s1=!!STATE.solved['t-1']||!!STATE.solved['t-2'], s4=!!STATE.solved['t-2'];
  const s2=TRAIN.saved||TRAIN.erased||s4, s3=TRAIN.erased||s4, s5=s4 && !DIRTY;
  const ok=[s1,s2,s3,s4,s5];
  const cur=ok.indexOf(false);
  ok.forEach((v,i)=>{ const el=$('#st'+(i+1)); el.classList.toggle('ok',v); el.classList.toggle('cur',i===cur); $('.sn',el).textContent = v?'✓':(i+1); });
  $('#tStage').innerHTML = `<span class="${STATE.solved['t-1']?'':'empty'}">⭐</span><span class="${STATE.solved['t-2']?'':'empty'}">⭐</span>`;
  $('#tCheck').checked=!!STATE.solved['t-1'];
  $('#tSaveMsg').textContent = TRAIN.saved ? '✓ Gespeichert! Weiter mit Schritt 3.' : '';
}

/* ---------------- session pages ---------------- */
function buildSession(id, blocks, nextId, nextLabel){
  const p=$('#page_'+id);
  const body=h('div'); p.appendChild(body);
  renderBlocks(body, blocks, id);
  // table of contents after the intro
  const h2s=$$('h2[id]',body);
  if(h2s.length){
    const toc=h('div',{class:'card'}); toc.innerHTML=`<b>Inhalt</b><ul class="toc">${h2s.map(x=>`<li><a href="#${x.id}">${x.textContent}</a></li>`).join('')}</ul>`;
    body.insertBefore(toc, h2s[0]);
    $$('a',toc).forEach(a=>a.onclick=e=>{ e.preventDefault(); const t=document.getElementById(a.getAttribute('href').slice(1)); window.scrollTo({top:t.getBoundingClientRect().top+window.scrollY-110, behavior:'smooth'}); });
  }
  const nav=h('div',{class:'sessionnav'});
  nav.innerHTML=`<button class="bigbtn gray" data-a="save">💾 Fortschritt speichern</button>${nextId?`<button class="bigbtn" data-a="next">${nextLabel} ➜</button>`:''}`;
  $('[data-a=save]',nav).onclick=saveDialog;
  if(nextId) $('[data-a=next]',nav).onclick=()=>showPage(nextId);
  p.appendChild(nav);
}

/* ---------------- summary ---------------- */
function renderSummary(){
  const p=$('#page_sum'); if(!p || !ORDER.length) return;
  const rows=SESSIONS.filter(s=>s.id!=='sum' && !(CLOUD_ON && s.id==='t')).map(s=>{
    const st=starCount(s.id), tot=totalStars(s.id), w=wrongCount(s.id), rv=Object.keys(STATE.revealed).filter(k=>STATE.revealed[k]&&sessOf(k)===s.id).length;
    return `<tr><td>${s.tab}</td><td class="n">⭐ ${st} / ${tot}</td><td><div class="bar"><div style="width:${tot?Math.round(100*st/tot):0}%"></div></div></td><td class="n">${w}</td><td class="n">${rv}</td></tr>`;
  }).join('');
  const hard = Object.keys(STATE.wrong).filter(k=>STATE.wrong[k]>0).sort((a,b)=>STATE.wrong[b]-STATE.wrong[a]).slice(0,6).map(k=>{
    const q=document.getElementById('q_'+k); const lab = q? ($('.qnum',q)?.textContent||'') : k; const sess=SESSIONS.find(s=>s.id===sessOf(k));
    return `<li><a href="#" data-q="${k}">${sess?sess.short:''} – ${lab}</a>: ${STATE.wrong[k]}× falsch${STATE.solved[k]?' (jetzt gelöst ✓)':''}</li>`; }).join('');
  p.innerHTML=`<h1>Mein Ergebnis</h1>
   <div class="card"><p><b>Name:</b> ${STATE.name||'<i>kein Name – bitte im Start-Tab eingeben</i>'}</p>
   <table class="sum"><thead><tr><th>Teil</th><th>Sterne</th><th></th><th>✗ falsch</th><th>Lösung angezeigt</th></tr></thead><tbody>${rows}
   <tr><th>Gesamt</th><th>⭐ ${starCount()} / ${totalStars()}</th><th></th><th>${wrongCount()}</th><th>${Object.keys(STATE.revealed).filter(k=>STATE.revealed[k]).length}</th></tr></tbody></table>
   ${STATE.tampered?'<p class="errmsg">⚠ Eine geladene Datei wurde verändert.</p>':''}
   ${STATE.foreign&&STATE.foreign.length?`<p class="errmsg">⚠ Es wurde eine Datei von einer anderen Person geladen: ${STATE.foreign.join(', ')}</p>`:''}
   <p class="small">Begonnen: ${STATE.created?new Date(STATE.created).toLocaleString('de-DE'):'-'} · Letzte Änderung: ${STATE.updated?new Date(STATE.updated).toLocaleString('de-DE'):'-'}</p></div>
   ${hard?`<div class="card"><b>Diese Aufgaben waren schwer für dich – schau sie dir noch einmal an:</b><ul>${hard}</ul></div>`:''}
   <div class="card">${CLOUD_ON?'<b>Für die Lehrkraft:</b> Dein Ergebnis ist automatisch online gespeichert. Deine Lehrkraft kann es sehen. ☁️<br><br>':'<b>Für die Lehrkraft:</b> Speichere deinen Fortschritt als Datei und gib die Datei ab, wenn deine Lehrkraft das möchte.<br><br>'}
   <button class="bigbtn" id="sumSave">💾 Speichern</button></div>`;
  $('#sumSave').onclick=saveDialog;
  $$('a[data-q]',p).forEach(a=>a.onclick=e=>{ e.preventDefault(); const id=a.dataset.q; showPage(sessOf(id), true); const el=document.getElementById('q_'+id); if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-120}); });
}

/* ---------------- init ---------------- */
function init(){
  if(CLOUD_ON){ document.documentElement.classList.add('cloud'); const bk=readBackup(); if(bk) STATE=Object.assign(freshState(),bk); }
  buildShell();
  buildTraining();
  buildSession('s1', S1, 's2', 'Weiter zu Sitzung 2');
  buildSession('s2', S2, 's3', 'Weiter zu Sitzung 3');
  buildSession('s3', S3, 'sum', 'Zu meinem Ergebnis');
  const bk=readBackup();
  if(!CLOUD_ON && bk && Object.keys(bk.solved).length){
    const b=$('#backupBanner'); b.classList.add('show');
    b.innerHTML=`🔎 Dieser Browser hat noch einen Fortschritt gespeichert: <b>${bk.name||'ohne Name'}</b>, ⭐ ${Object.keys(bk.solved).length}. <button class="bigbtn gray" id="bkLoad">Laden</button> <button class="vbtn" id="bkNo">Nein, danke</button>`;
    $('#bkLoad').onclick=loadFromBackup; $('#bkNo').onclick=()=>b.classList.remove('show');
  }
  refreshAllQuestions();
  updateCounters(false);
  let tab='t'; try{ const t=localStorage.getItem(APP_KEY+'_tab'); if(t && $('#page_'+t)) tab=t; }catch(e){}
  showPage(tab, true);
  window.addEventListener('beforeunload',e=>{ if(!CLOUD_ON && DIRTY && starCount()>0){ e.preventDefault(); e.returnValue=''; } });
  Cloud.init({
    app:APP_ID,
    titel:'Physik 9: Magnetfeld & Induktion',
    getState:()=>({name:STATE.name,solved:STATE.solved,wrong:STATE.wrong,revealed:STATE.revealed,tests:STATE.tests,tans:STATE.tans,qt:STATE.qt,away:STATE.away,photos:photosMeta(false),created:STATE.created,tampered:STATE.tampered||undefined,foreign:STATE.foreign||undefined}),
    photos:()=>Object.keys(STATE.photos||{}).filter(k=>STATE.photos[k].src).map(k=>({key:k, ph:STATE.photos[k]})),
    onPhotos:()=>{ backupToBrowser(); refreshPhotos(); },
    hasProgress:()=>starCount()>0||wrongCount()>0,
    setState:st=>{ const old=STATE.photos||{}; STATE = st ? Object.assign(freshState(), st, {name:STATE.name}) : freshState();
      if(st) for(const k in STATE.photos){ const o=old[k], p=STATE.photos[k]; if(o && o.src && o.t===p.t){ p.src=o.src; if(!p.fid && o.fid) p.fid=o.fid; } }
      DIRTY=false; backupToBrowser(); refreshAllQuestions(); updateCounters(false); },
    getSummary:cloudSummary,
    onLogin:info=>{ STATE.name=info.voll||info.name||info.u; backupToBrowser(); updateCounters(false); const w=$('#wName'); if(w) w.textContent=STATE.name; setTimeout(()=>Cloud.changed(),0); }
  });
}

/* ---------------- Übersicht für die Lehrkraft (Google Sheet) ---------------- */
// Eine Spalte pro Abschnitt (1.1 … 3.9): Sterne / Aufgaben, falsche Antworten
const SECTIONS=[];
[['s1',S1,1],['s2',S2,2],['s3',S3,3]].forEach(([sid,blocks,n])=>{
  let cur={key:sid+'-0',label:n+'.0',title:'Sitzung '+n+': Einstieg',ids:[]};
  const push=()=>{ if(cur.ids.length) SECTIONS.push(cur); };
  blocks.forEach(b=>{
    if(b.t==='h2'){ push(); const m=String(b.text).match(/^(\d+\.\d+)\s+(.*)$/); cur={key:b.id||(sid+'-'+SECTIONS.length),label:m?m[1]:b.text,title:b.text,ids:[]}; }
    else if(b.t==='test') b.items.forEach(x=>x.id&&cur.ids.push(x.id));
    else if(b.id && ['mc','num','cloze','match','heft'].includes(b.t)) cur.ids.push(b.id);
  });
  push();
});
function cloudSummary(){
  const tasks={};
  SECTIONS.forEach(s=>{
    const sol=s.ids.filter(i=>STATE.solved[i]).length, rv=s.ids.filter(i=>STATE.revealed[i]&&!STATE.solved[i]).length;
    const err=s.ids.reduce((a,i)=>a+(STATE.wrong[i]||0),0);
    tasks[s.key]=[sol,s.ids.length,err,sol+rv,s.ids.length,s.label,s.title];
  });
  const ids=Object.keys(tasks), heft=ORDER.filter(i=>/heft/.test(i));
  const sess=n=>starCount('s'+n)+' / '+totalStars('s'+n);
  const rv=Object.keys(STATE.revealed).filter(k=>STATE.revealed[k]&&!STATE.solved[k]).length;
  const note=(STATE.tampered?'Datei wurde verändert. ':'')+((STATE.foreign&&STATE.foreign.length)?'Datei von: '+STATE.foreign.join(', '):'');
  return {stars:starCount(),max:totalStars(),err:wrongCount(),done:ids.filter(i=>tasks[i][3]>=tasks[i][4]).length,n:ids.length,tasks,
    labels:{sterne:'⭐ Sterne',max:'⭐ max.',fehler:'✗ falsch',erledigt:'Abschnitte fertig'},
    fotos:PHOTO_KEYS.slice(),
    extra:{s1:['Sitzung 1 ⭐',sess(1)],s2:['Sitzung 2 ⭐',sess(2)],s3:['Sitzung 3 ⭐',sess(3)],
      heft:['✍️ Merksätze im Heft',heft.filter(i=>STATE.solved[i]).length+' / '+heft.length],
      fotos:['📷 Merksatz-Fotos',PHOTO_KEYS.filter(k=>STATE.photos[k]&&STATE.photos[k].fid).length+' / '+PHOTO_KEYS.length],
      ...Object.fromEntries(TESTS.map(t=>{ const o=(STATE.tests||{})[t.id]||{};
        const v = testDone(t) ? t.ids.filter(i=>STATE.solved[i]).length+' / '+t.ids.length+(o.sec?' · ⏱'+mmss(o.sec):'')+(o.away?' · 👀'+o.away:'') : (testStarted(t)?'begonnen'+(o.away?' · 👀'+o.away:''):'–');
        return ['test'+t.sess,['📝 Abschlusstest', v]]; })),
      away:['🚪 Seite verlassen', (STATE.away&&STATE.away.n) ? STATE.away.n+'× · '+mmss(STATE.away.sec) : '–'],
      slow:['⏰ zu langsam', (()=>{ const q=STATE.qt||{}, k=Object.keys(q); const tot=k.reduce((s,i)=>s+q[i][0],0); return k.length ? k.filter(i=>q[i][1]===2).length+' von '+k.length+' · Σ '+mmss(tot) : '–'; })()],
      rv:['👀 Lösung angezeigt',String(rv)],hinweis:['⚠ Hinweis',note]}};
}
document.addEventListener('DOMContentLoaded', init);

</script>
